# Quick convergence test for MCMC tuning.
#
# Goal: in <90 min total wall time, run 8 short chains, then compute split-R̂
# and ESS_bulk to verify the tuned proposal widths + adapt_proposals work
# (vs the previous catastrophic R̂=38 / ESS=50 with the old narrow widths).
#
# Reductions from production config (`example_mcmc_relic_tuned.yaml`):
#   - num_models 30  (was 10000):  minimum useful for split-R̂ with half=15;
#                                  enough to distinguish R̂≈1 from R̂≫1
#   - burn_in    50  (was 5000):   covers ~1 adapt window so the rate has a
#                                  chance to be tuned before sampling starts
#   - max_attempts 3000:           per-chain safety cap (~5× expected proposals
#                                  at 25% acceptance)
#   - pipeline reduced to prep_input + SPheno + micromegas (drop softsusy,
#     superiso, gm2calc, feynhiggs — none needed for the relic_density chi²)
#
# Wall-time estimate per chain @ ~10s/proposal on CPU:
#   burn_in  50 accepts ≈ 200 proposals ≈ 2000s ≈ 35 min
#   sample   30 accepts ≈ 120 proposals ≈ 1200s ≈ 20 min
#   total                                       ≈ 55 min
# 8 chains run in parallel on one node → wall-clock ~55 min.
#
# Run with `slurm/test_mcmc_convergence.sbatch`.
prior: mcmc
num_models: 30
isGMSB: False

parameters:
  AT: [-8000, 8000]
  Ab: [-2000, 2000]
  Atau: [-2000, 2000]
  M_1: [-2000, 2000]
  M_2: [-2000, 2000]
  M_3: [4000, 4000]
  mA: [2000, 2000]
  mbR: [4000, 4000]
  mdR: [4000, 4000]
  meL: [0, 2000]
  meR: [0, 2000]
  mqL1: [4000, 4000]
  mqL3: [4000, 4000]
  mtR: [4000, 4000]
  mtauL: [2000, 2000]
  mtauR: [2000, 2000]
  mu: [-2000, 2000]
  muR: [4000, 4000]
  tanb: [1, 60]

mcmc:
  burn_in: 50
  max_attempts: 3000
  accept_invalid: false
  restart_after: 1000

  proposal_widths:
    M_1:   50.0
    M_2:   50.0
    mu:    50.0
    tanb:   2.0
    AT:   200.0
    Ab:   100.0
    Atau: 100.0
    meL:   50.0
    meR:   50.0

  # Fast-converging adaptation (small window, larger lr) so the burn-in is
  # actually long enough for the rate to settle near 0.25.
  adapt_proposals:
    enabled: true
    target_acceptance: 0.25
    window: 50
    learning_rate: 0.10

constraints:
  - name: relic_density
    source:
      step: micromegas
      file_type: csv
      variable: Omega
    type: gaussian
    central: 0.120
    uncertainty: 0.012

steps:
  - name: prep_input
    output_dir: input
    prefix: IN
  - name: SPheno
    input_dir: input
    output_dir: SPheno
    log_dir: SPheno_log
    prefix: SP
  - name: micromegas
    input_dir: SPheno
    output_dir: micromegas
    prefix: MO
