[workspace]
name = "Run3ModelGen"
version = "0.4.0"
description = "Modern pMSSM Model Generation Framework"
authors = ["Jonas Wuerzinger <jonas.wuerzinger@gmail.com>"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[tasks]

build = """
cmake -S source -B build && \
cmake \
    --build build \
    --parallel 8
"""

# c.f. https://github.com/prefix-dev/pixi/issues/1350
genModels = """
bash -c '\
. build/setup.sh && \
mkdir -p run && \
cd run && \
genModels.py'
"""

extractModels = """
bash -c '\
. build/setup.sh && \
cd run && \
extractModels.py --scan_dir scan --root_file scan/ntuple.0.0.root --selection "(akarr['SS_m_h']!=-1) & (akarr['SS_m_h'] <= 130)"'
"""

clean = """
rm -rf build && \
rm -rf run
"""

genModels-clean = { depends-on = ["clean", "build", "genModels"] }

[target.linux-64.tasks]
# Use nproc as available
build = """
cmake -S source -B build && \
cmake \
    --build build \
    --clean-first \
    --parallel "$(nproc --ignore=1)"
"""

[dependencies]
python = "3.11.*"
gfortran = ">=13.2.0,<13.3"
cmake = ">=3.29.2,<3.30"
numpy = ">=1.26.4,<1.27"
pyyaml = ">=6.0.1,<6.1"
make = ">=4.3,<5"
which = ">=2.21,<3"
automake = ">=1.16.5,<1.17"
uproot = ">=5.3.7,<5.4"
rich = ">=13.7.1,<13.8"
structlog = ">=25.5.0,<26"
click = ">=8.1.7,<8.2"
boost = ">=1.85.0,<1.86"
eigen = ">=3.4.0,<3.5"
pandas = ">=2.2.2,<2.3"
git = ">=2.45.1,<2.46"
pyslha = ">=3.3.0"
spheno-atlas = ">=4.0.6,<5"
colorama = ">=0.4.6,<0.5"

[target.linux-64.dependencies]
gcc = ">=13.2.0,<13.3"
cxx-compiler = ">=1.0.0,<1.1"
libconfig = ">=1.7.3,<1.8"
