# SLURM profile (defaults tuned for the MPCDF viper cluster used so far:
# partition 'general', scan dirs on /ptmp — pass e.g.
#   --config scan_parent=/ptmp/$USER/run3modelgen/<runid>
# at invocation; scan_parent must be on a filesystem visible to all workers).
executor: slurm
# High enough that every batch is submitted immediately, so a dead orchestrator
# cannot leave batches unsubmitted (see the htcondor profile for the reasoning).
# Lower it if the site enforces a MaxSubmitJobs limit — but then a driver (or a
# periodic re-run of the same command) really is required to finish the run.
jobs: 1000
local-cores: 4
# Driver-side retries: only apply while the orchestrator lives. Slurm has no
# equivalent for a non-zero exit — slurm-requeue below covers node failure and
# preemption only — so on this backend a driver death does mean failed batches
# wait for a manual re-run.
retries: 2
keep-going: true
rerun-incomplete: true
latency-wait: 60
slurm-requeue: true

# One cluster job per batch: all per-batch rules share a group, and batches are
# disconnected components, so each batch's sample -> steps -> ntuple chain is
# submitted as a single SLURM job (legacy job granularity, ~10x less scheduler
# churn). Incremental re-runs still execute only the missing rules.
groups:
  - sample=batch
  - step=batch
  - ntuple=batch
  - chain=batch
  - tarball=batch
  - publish=batch     # publish inside the batch job (parity with htcondor)
group-components:
  - batch=1

# NB: a group job's time limit is the SUM of its rules' runtimes. Deliberately NO
# `runtime` override for sample/step/ntuple here: those rules now compute their own
# from the measured per-model cost of each tool (see _rule_runtime in
# workflow/rules/generate.smk), which puts ~83% of the group's allowance on SModelS
# instead of giving all eight steps the slow tool's budget. A flat 120 min/step summed
# to 16h for ~1.5h of work and capped a batch at ~2100 models; the scaled budget fits
# a full 10k-model batch (the per-directory cap) in ~17h of the 24h partition limit.
# A `set-resources` entry for those rules would silently override the scaling.
default-resources:
  slurm_partition: "'general'"
  runtime: 60           # minutes; applies only to rules with no runtime of their own
  mem_mb: 4000

set-resources:
  step:
    # SModelS alone peaks at ~1.6 GB just loading the results database (measured),
    # before pythia8 and the python interpreter on top. With threads: 1 (below) up to
    # 4 steps run CONCURRENTLY inside one batch job, each with its own interpreter and
    # its own copy of whatever it loads, so the old 8 GB is no longer enough. The group
    # requests max(mem_mb) over its rules.
    mem_mb: 16000
    # The slurm plugin derives cpus_per_task from threads; with threads: 1 that would
    # shrink the batch job to a single CPU and re-serialise the steps. Ask explicitly.
    cpus_per_task: 4
  chain:
    runtime: 1380       # a full MH chain is one long sequential job (23h)
    mem_mb: 8000

set-threads:
  step: 1               # each step is a SINGLE-threaded loop over models, so claiming
                        # 4 (the legacy RequestCpus=4) meant one step monopolised the
                        # job's whole allocation and they ran strictly one at a time.
                        # Claiming 1 against cpus_per_task: 4 lets four run at once —
                        # micromegas/superiso/gm2calc/feynhiggs/SModelS all gate on
                        # SPheno, so the cheap four hide inside SModelS' runtime
                        # (~11h serial -> ~9.5h, SModelS-bound).
  chain: 4
