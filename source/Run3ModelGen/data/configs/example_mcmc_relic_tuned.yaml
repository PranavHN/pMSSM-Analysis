# Tuned production MCMC config: relic-density-only scan, full pipeline.
#
# `prior: mcmc` runs the emcee (affine-invariant ensemble) sampler
# (ModelGenerator.run_emcee -> Run3ModelGen.emcee_sampler). emcee's stretch move
# adapts automatically to the correlated, thin relic-density isosurface, so no
# manual proposal-width tuning is needed (unlike the old hand-rolled sampler,
# which reached split-R̂ ~ 38 / ESS ~ 50 over 410k samples with mis-scaled widths).
#
# Free parameters (9): M_1, M_2, mu, tanb, AT, Ab, Atau, meL, meR.
# Everything else is fixed (lo == hi) and held constant.
#
# Run via the standard entry point:
#   genModels.py --config_file <this file> --scan_dir <dir> --seed <n>
# or the SLURM array in slurm/emcee_production.sbatch (4 independent ensembles).
# Diagnose with scripts/emcee_diagnostics.py (see doc/emcee.md).
prior: mcmc
num_models: 1          # emcee uses modelnum=0 per worker; keeps the >10000 guard happy
isGMSB: False

# Wall-clock timeout (seconds) per external physics-tool call. Guards against a
# single hung binary stalling a whole emcee half-step over millions of evals.
tool_timeout: 300

parameters:
  AT: [-8000, 8000]
  Ab: [-2000, 2000]
  Atau: [-2000, 2000]
  M_1: [-2000, 2000]
  M_2: [-2000, 2000]
  M_3: [4000, 4000]
  mA: [2000, 2000]
  mbR: [4000, 4000]
  mdR: [4000, 4000]
  meL: [0, 2000]
  meR: [0, 2000]
  mqL1: [4000, 4000]
  mqL3: [4000, 4000]
  mtR: [4000, 4000]
  mtauL: [2000, 2000]
  mtauR: [2000, 2000]
  mu: [-2000, 2000]
  muR: [4000, 4000]
  tanb: [1, 60]

# emcee sampler knobs (prior: mcmc).
mcmc:
  nwalkers: 256              # = 2 * nworkers: one 128-wide wave per half-step
  nworkers: 128             # physical cores on a Viper node
  max_steps: 100000         # iteration cap; the wall-clock guard / convergence stops earlier
  burn_in: 300              # absolute floor (iterations) on the ntuple burn-in
  burn_in_factor: 3         # ntuple discard = max(burn_in, ceil(burn_in_factor*max_tau)); matches emcee_diagnostics
  check_every: 100          # autocorr / progress cadence (iterations)
  target_autocorr_factor: 50  # require N > 50*tau for convergence
  tau_rel_tol: 0.01         # AND tau stable to 1%
  walltime_hours: 23        # wall-clock guard budget (matches sbatch --time)

  init:
    strategy: spread        # uniform across the prior -> broad exploration
    center_file: null       # CSV seed point for `ball` init (optional)

  # Default StretchMove(a=2.0). If the relic isosurface mixes poorly (large tau),
  # switch to a DE-move mixture, e.g.:
  #   - {type: DEMove, weight: 0.8}
  #   - {type: DESnookerMove, weight: 0.2}
  moves:
    - {type: StretchMove, kwargs: {a: 2.0}, weight: 1.0}

  # Observables recorded per sample as emcee blobs -> ntuple branches. `source`
  # uses the same schema as `constraints`; `branch` reproduces the ntupling names.
  record_observables:
    - {name: Omega,      branch: MO_Omega,          source: {step: micromegas, file_type: csv,  variable: Omega}}
    - {name: m_h,        branch: SP_m_h,            source: {step: SPheno,   file_type: slha, block: MASS, entry: 25}}
    - {name: m_H,        branch: SP_m_H,            source: {step: SPheno,   file_type: slha, block: MASS, entry: 35}}
    - {name: m_A,        branch: SP_m_A,            source: {step: SPheno,   file_type: slha, block: MASS, entry: 36}}
    - {name: m_gl,       branch: SP_m_gl,           source: {step: SPheno,   file_type: slha, block: MASS, entry: 1000021}}
    - {name: m_chi_10,   branch: SP_m_chi_10,       source: {step: SPheno,   file_type: slha, block: MASS, entry: 1000022}}
    - {name: m_chi_20,   branch: SP_m_chi_20,       source: {step: SPheno,   file_type: slha, block: MASS, entry: 1000023}}
    - {name: m_chi_1p,   branch: SP_m_chi_1p,       source: {step: SPheno,   file_type: slha, block: MASS, entry: 1000024}}
    - {name: m_t_1,      branch: SP_m_t_1,          source: {step: SPheno,   file_type: slha, block: MASS, entry: 1000006}}
    - {name: m_b_1,      branch: SP_m_b_1,          source: {step: SPheno,   file_type: slha, block: MASS, entry: 1000005}}
    - {name: m_tau_1,    branch: SP_m_tau_1,        source: {step: SPheno,   file_type: slha, block: MASS, entry: 1000015}}
    - {name: m_e_L,      branch: SP_m_e_L,          source: {step: SPheno,   file_type: slha, block: MASS, entry: 1000011}}
    - {name: BR_bsg,     branch: SI_BR_b_to_sgamma, source: {step: superiso, file_type: flha, block: FOBS, entry: [5, 1]}}
    - {name: BR_bsmumu,  branch: SI_BR_Bs_to_mumu,  source: {step: superiso, file_type: flha, block: FOBS, entry: [531, 1]}}
    - {name: a_mu,       branch: GM2_gmuon,         source: {step: gm2calc,  file_type: slha, block: GM2CALCOUTPUT, entry: 0}}
    - {name: FH_m_h,     branch: FH_m_h,            source: {step: feynhiggs, file_type: slha, block: MASS, entry: 25}}

constraints:
  - name: relic_density
    source:
      step: micromegas
      file_type: csv
      variable: Omega
    type: gaussian
    central: 0.120
    uncertainty: 0.012

steps:
  - name: prep_input
    output_dir: input
    prefix: IN
  - name: SPheno
    input_dir: input
    output_dir: SPheno
    log_dir: SPheno_log
    prefix: SP
  - name: softsusy
    input_dir: input
    output_dir: softsusy
    prefix: SS
  - name: micromegas
    input_dir: SPheno
    output_dir: micromegas
    prefix: MO
  - name: superiso
    input_dir: SPheno
    output_dir: superiso
    prefix: SI
  - name: gm2calc
    input_dir: SPheno
    output_dir: gm2calc
    prefix: GM2
  - name: feynhiggs
    input_dir: SPheno
    output_dir: feynhiggs
    log_dir: feynhiggs_log
    prefix: FH
