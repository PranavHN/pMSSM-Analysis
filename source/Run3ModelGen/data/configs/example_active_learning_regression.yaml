# Active learning on the relic density: deep GP + regression + entropy batch.
#
# The regression head learns t = log(Omega h^2 / 0.12) and the entropy-batch rule
# selects a diverse batch of points whose posterior straddles t = 0, after the tolerance
# cut |t_pred| < 1 and the proximity weighting of the variance. The deep GP is warm
# started from the previous iteration (the paper's production setting for the GPs).
# See example_active_learning_config.yaml for how to run it.
prior: active_learning
num_models: 500
isGMSB: False
tool_timeout: 300

active_learning:
  environment: rocm
  nworkers: 16
  seed_models: 2000
  n_iterations: 40
  model: deep_gp
  head: regression
  strategy: entropy_batch
  training:
    warm_start: true
  gp:
    num_inducing_max: 256
  acquisition:
    tolerance: 1.0
    proximity: 0.1
    entropy_pool_size: 5000
    entropy_blur: 0.15
    entropy_beta: 50.0
  target:
    branch: MO_Omega
    value: 0.12
    transform: log
    valid: {lo: 0.0, hi: 1.0}
    hit_tolerance: 0.10
  vetoes:
    - {branch: SP_m_h, lo: 0.0}
    - {branch: SP_LSP_type, lo: 0.5, hi: 3.5}

parameters:
  AT: [-8000, 8000]
  Ab: [-2000, 2000]
  Atau: [-2000, 2000]
  M_1: [-2000, 2000]
  M_2: [-2000, 2000]
  M_3: [4000, 4000]
  mA: [2000, 2000]
  mbR: [4000, 4000]
  mdR: [4000, 4000]
  meL: [0, 2000]
  meR: [0, 2000]
  mqL1: [4000, 4000]
  mqL3: [4000, 4000]
  mtR: [4000, 4000]
  mtauL: [2000, 2000]
  mtauR: [2000, 2000]
  mu: [-2000, 2000]
  muR: [4000, 4000]
  tanb: [1, 60]

steps:
  - name: prep_input
    output_dir: input
    prefix: IN
  - name: SPheno
    input_dir: input
    output_dir: SPheno
    log_dir: SPheno_log
    prefix: SP
  - name: micromegas
    input_dir: SPheno
    output_dir: micromegas
    prefix: MO
