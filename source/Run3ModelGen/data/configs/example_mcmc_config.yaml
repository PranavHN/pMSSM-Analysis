prior: mcmc
num_models: 500
isGMSB: False

parameters:
  tanb: [1, 60]
  M_1: [-2000, 2000]
  M_2: [-2000, 2000]
  M_3: [1000, 4000]
  AT: [-8000, 8000]
  Ab: [-2000, 2000]
  Atau: [-2000, 2000]
  mu: [-2000, 2000]
  mA: [0, 2000]
  meL: [0, 2000]
  mtauL: [2000, 2000]
  meR: [0, 2000]
  mtauR: [2000, 2000]
  mqL1: [4000, 4000]
  mqL3: [0, 2000]
  muR: [4000, 4000]
  mtR: [0, 2000]
  mdR: [4000, 4000]
  mbR: [0, 2000]

mcmc:
  burn_in: 100
  max_attempts: 50000
  accept_invalid: false
  proposal_widths:
    tanb: 3.0
    M_1: 100.0
    M_2: 100.0
    M_3: 200.0
    AT: 400.0
    Ab: 100.0
    Atau: 100.0
    mu: 100.0
    mA: 100.0
    meL: 100.0
    mtauL: 100.0
    meR: 100.0
    mtauR: 100.0
    mqL1: 200.0
    mqL3: 100.0
    muR: 200.0
    mtR: 100.0
    mdR: 200.0
    mbR: 100.0

constraints:
  - name: higgs_mass
    source:
      step: SPheno
      file_type: slha
      block: MASS
      entry: 25
    type: gaussian
    central: 125.09
    uncertainty: 3.0

  - name: relic_density
    source:
      step: micromegas
      file_type: csv
      variable: Omega
    type: upper_bound
    central: 0.120
    uncertainty: 0.012

  - name: bsg_branching
    source:
      step: superiso
      file_type: flha
      block: FOBS
      entry: [5, 1]
    type: gaussian
    central: 3.32e-4
    uncertainty: 0.33e-4

  - name: bs_mumu
    source:
      step: superiso
      file_type: flha
      block: FOBS
      entry: [531, 1]
    type: gaussian
    central: 3.09e-9
    uncertainty: 0.65e-9

steps:
  - name: prep_input
    output_dir: input
    prefix: IN
  - name: SPheno
    input_dir: input
    output_dir: SPheno
    log_dir: SPheno_log
    prefix: SP
  - name: softsusy
    input_dir: input
    output_dir: softsusy
    prefix: SS
  - name: micromegas
    input_dir: SPheno
    output_dir: micromegas
    prefix: MO
  - name: superiso
    input_dir: SPheno
    output_dir: superiso
    prefix: SI
  - name: gm2calc
    input_dir: SPheno
    output_dir: gm2calc
    prefix: GM2
  - name: feynhiggs
    input_dir: SPheno
    output_dir: feynhiggs
    log_dir: feynhiggs_log
    prefix: FH
  - name: SModelS
    input_dir: SPheno
    output_dir: SModelS
    prefix: SModelS
