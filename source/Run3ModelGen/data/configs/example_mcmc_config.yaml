prior: mcmc
num_models: 1          # emcee uses modelnum=0 per worker; keeps the >10000 guard happy
isGMSB: False

parameters:
  tanb: [1, 60]
  M_1: [-2000, 2000]
  M_2: [-2000, 2000]
  M_3: [1000, 4000]
  AT: [-8000, 8000]
  Ab: [-2000, 2000]
  Atau: [-2000, 2000]
  mu: [-2000, 2000]
  mA: [0, 2000]
  meL: [0, 2000]
  mtauL: [2000, 2000]
  meR: [0, 2000]
  mtauR: [2000, 2000]
  mqL1: [4000, 4000]
  mqL3: [0, 2000]
  muR: [4000, 4000]
  mtR: [0, 2000]
  mdR: [4000, 4000]
  mbR: [0, 2000]

mcmc:
  # emcee affine-invariant ensemble sampler (see doc/emcee.md). No proposal-width
  # tuning: the stretch move adapts to the target's scale and correlations.
  nwalkers: 64            # >= 2*ndim; even; = 2*nworkers (one wave per half-step)
  nworkers: 32
  max_steps: 20000        # cap; convergence (N > 50*tau) usually stops earlier
  burn_in: 200            # absolute floor (iterations) on the ntuple burn-in
  burn_in_factor: 3       # ntuple discard = max(burn_in, ceil(burn_in_factor*max_tau))
  check_every: 100        # autocorr / progress cadence (iterations)
  target_autocorr_factor: 50
  tau_rel_tol: 0.01
  init:
    strategy: spread      # uniform across the prior
  moves:
    - {type: StretchMove, kwargs: {a: 2.0}, weight: 1.0}
  record_observables:     # emcee blobs -> ntuple branches
    - {name: m_h,       branch: SP_m_h,            source: {step: SPheno,   file_type: slha, block: MASS, entry: 25}}
    - {name: Omega,     branch: MO_Omega,          source: {step: micromegas, file_type: csv, variable: Omega}}
    - {name: BR_bsg,    branch: SI_BR_b_to_sgamma, source: {step: superiso, file_type: flha, block: FOBS, entry: [5, 1]}}
    - {name: BR_bsmumu, branch: SI_BR_Bs_to_mumu,  source: {step: superiso, file_type: flha, block: FOBS, entry: [531, 1]}}
    - {name: a_mu,      branch: GM2_gmuon,         source: {step: gm2calc,  file_type: slha, block: GM2CALCOUTPUT, entry: 0}}

constraints:
  - name: higgs_mass
    source:
      step: SPheno
      file_type: slha
      block: MASS
      entry: 25
    type: gaussian
    central: 125.09
    uncertainty: 3.0

  - name: relic_density
    source:
      step: micromegas
      file_type: csv
      variable: Omega
    type: upper_bound
    central: 0.120
    uncertainty: 0.012

  - name: bsg_branching
    source:
      step: superiso
      file_type: flha
      block: FOBS
      entry: [5, 1]
    type: gaussian
    central: 3.32e-4
    uncertainty: 0.33e-4

  - name: bs_mumu
    source:
      step: superiso
      file_type: flha
      block: FOBS
      entry: [531, 1]
    type: gaussian
    central: 3.09e-9
    uncertainty: 0.65e-9

steps:
  - name: prep_input
    output_dir: input
    prefix: IN
  - name: SPheno
    input_dir: input
    output_dir: SPheno
    log_dir: SPheno_log
    prefix: SP
  - name: softsusy
    input_dir: input
    output_dir: softsusy
    prefix: SS
  - name: micromegas
    input_dir: SPheno
    output_dir: micromegas
    prefix: MO
  - name: superiso
    input_dir: SPheno
    output_dir: superiso
    prefix: SI
  - name: gm2calc
    input_dir: SPheno
    output_dir: gm2calc
    prefix: GM2
  - name: feynhiggs
    input_dir: SPheno
    output_dir: feynhiggs
    log_dir: feynhiggs_log
    prefix: FH
  - name: SModelS
    input_dir: SPheno
    output_dir: SModelS
    prefix: SModelS
