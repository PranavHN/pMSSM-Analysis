# Lightweight MCMC (emcee) config for CI / local smoke testing.
# `prior: mcmc` runs the emcee sampler. Standard pMSSM ranges (9 free params);
# kept tiny (few steps, reduced prep_input + SPheno pipeline) so it finishes fast.
#
# Local smoke test:
#   genModels.py --config_file <this file> --scan_dir /ptmp/$USER/mcmc_smoke --seed 0
prior: mcmc
num_models: 1
isGMSB: False
tool_timeout: 120

mcmc:
  nwalkers: 18             # >= 2 * ndim (9 free params)
  nworkers: 4
  max_steps: 4
  burn_in: 1
  check_every: 2
  walltime_hours: 1
  init:
    strategy: spread
  moves:
    - {type: StretchMove, kwargs: {a: 2.0}, weight: 1.0}
  record_observables:
    - {name: m_h, branch: SP_m_h, source: {step: SPheno, file_type: slha, block: MASS, entry: 25}}

constraints:
  - name: higgs_mass
    source:
      step: SPheno
      file_type: slha
      block: MASS
      entry: 25
    type: gaussian
    central: 125.09
    uncertainty: 3.0

parameters:
  meL: [0, 2000]
  meR: [0, 2000]
  mtauL: [2000, 2000]
  mtauR: [2000, 2000]
  mqL1: [4000, 4000]
  muR: [4000, 4000]
  mdR: [4000, 4000]
  mqL3: [4000, 4000]
  mtR: [4000, 4000]
  mbR: [4000, 4000]
  M_1: [-2000, 2000]
  M_2: [-2000, 2000]
  mu: [-2000, 2000]
  M_3: [4000, 4000]
  AT: [-8000, 8000]
  Ab: [-2000, 2000]
  Atau: [-2000, 2000]
  mA: [2000, 2000]
  tanb: [1, 60]

steps:
  - name: prep_input
    output_dir: input
    prefix: IN
  - name: SPheno
    input_dir: input
    output_dir: SPheno
    log_dir: SPheno_log
    prefix: SP
