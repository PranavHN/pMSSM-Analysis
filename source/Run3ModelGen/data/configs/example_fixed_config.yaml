prior: fixed
isGMSB: False

parameters:
  tanb: [10, 20, 30]
  M_1: [100, 200, 300]
  M_2: [200, 400, 600]
  M_3: [2000, 2000, 2000]
  AT: [-3000, -3000, -3000]
  Ab: [0, 0, 0]
  Atau: [0, 0, 0]
  mu: [300, 500, 700]
  mA: [1000, 1000, 1000]
  meL: [500, 500, 500]
  mtauL: [2000, 2000, 2000]
  meR: [500, 500, 500]
  mtauR: [2000, 2000, 2000]
  mqL1: [4000, 4000, 4000]
  mqL3: [1000, 1000, 1000]
  muR: [4000, 4000, 4000]
  mtR: [1000, 1000, 1000]
  mdR: [4000, 4000, 4000]
  mbR: [1000, 1000, 1000]

steps:
  - name: prep_input
    output_dir: input
    prefix: IN
  - name: SPheno
    input_dir: input
    output_dir: SPheno
    log_dir: SPheno_log
    prefix: SP
  - name: softsusy
    input_dir: input
    output_dir: softsusy
    prefix: SS
  - name: micromegas
    input_dir: SPheno
    output_dir: micromegas
    prefix: MO
  - name: superiso
    input_dir: SPheno
    output_dir: superiso
    prefix: SI
  - name: gm2calc
    input_dir: SPheno
    output_dir: gm2calc
    prefix: GM2
  - name: feynhiggs
    input_dir: SPheno
    output_dir: feynhiggs
    log_dir: feynhiggs_log
    prefix: FH
  - name: SModelS
    input_dir: SPheno
    output_dir: SModelS
    prefix: SModelS
