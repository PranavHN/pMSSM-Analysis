stages:
  - build
  - genModels
  - extractModels
  - publish

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  # Shared cache for SModelS's compiled pythia8 (see scripts/setup_pythia8.sh).
  # pythia8 lives inside the pixi env, which is re-created from scratch in every
  # job, so without this every stage recompiles it. The local track builds it once
  # in build_local and passes this dir as an artifact; downstream local jobs restore
  # from it instead of rebuilding. (The docker track overrides this to an image-baked
  # path in .setup_docker.)
  PYTHIA8_CACHE_DIR: "$CI_PROJECT_DIR/.pythia8-cache"
  # Shared cache for SModelS's downloaded results-database pickle (see
  # scripts/setup_smodels_db.sh). SModelS caches the (hundreds-of-MB) pickle here;
  # without a persistent, shared location every genModels job re-downloads it. The
  # build prefetches it into this dir, the local track passes it as an artifact, and
  # downstream jobs reuse it. (The docker track overrides this to an image-baked
  # path in .setup_docker.)
  SMODELS_CACHEDIR: "$CI_PROJECT_DIR/.smodels-cache"

# ---------------------------------------------------------------------------
# Templates
# ---------------------------------------------------------------------------

.install_pixi:
  before_script:
    # fetch and install pixi locally
    - curl -fsSL https://pixi.sh/install.sh | bash
    - . ~/.bash_profile

# Local template: activates pixi environment + sources build/setup.sh
# so that all subsequent script commands run with the full environment.
.setup_local:
  image: gitlab-registry.cern.ch/linuxsupport/alma9-base
  before_script:
    - curl -fsSL https://pixi.sh/install.sh | bash
    - . ~/.bash_profile
    - eval "$(pixi shell-hook)"
    - source build/setup.sh
    - mkdir -p run

# Docker template: sources ~/.bashrc (which includes pixi + setup.sh)
.setup_docker:
  variables:
    # The image already compiled pythia8 into this stable path (see Dockerfile).
    # Each docker job runs in a fresh checkout / fresh pixi env, so point the cache
    # here to restore the baked copy instead of recompiling in every job.
    PYTHIA8_CACHE_DIR: "/opt/pythia8-cache"
    # Likewise the SModelS database pickle is prefetched into this stable path in the
    # image (see Dockerfile); point the cache here so docker jobs reuse it instead of
    # re-downloading it.
    SMODELS_CACHEDIR: "/opt/smodels-cache"
  before_script:
    - . ~/.bashrc
    # Ensure SModelS's bundled pythia8 is built in the env `pixi run` will use.
    # (`. ~/.bashrc` sources build/setup.sh without the pixi env active, so its
    # pythia8 hook can't import smodels and skips — run it through `pixi run` here,
    # the same env activation used by `pixi run genModels.py` below. Idempotent.)
    - pixi run bash source/Run3ModelGen/scripts/setup_pythia8.sh || echo "[ci] pythia8 setup warning; the SModelS step may fail"
    - mkdir -p run

# genModels jobs additionally kinit so they can xrdcp their reference from EOS for
# compare_reference.py -- the per-step counts sidecar for every scan, plus the
# reference ntuple itself for the value-gated ones (mcmc). `extends`
# REPLACES before_script, so re-reference the base setup and append the kinit line.
# SERVICE_PASS (base64 of the nicebot password) and CERN_USER (=nicebot) are masked
# CI variables. (extractModels/publish don't read EOS, so they keep the base setup.)
.genmodels_local:
  extends: .setup_local
  before_script:
    - !reference [.setup_local, before_script]
    - printf "%s" "$SERVICE_PASS" | base64 -d | kinit "$CERN_USER@CERN.CH"

.genmodels_docker:
  extends: .setup_docker
  before_script:
    - !reference [.setup_docker, before_script]
    - printf "%s" "$SERVICE_PASS" | base64 -d | pixi run kinit "$CERN_USER@CERN.CH"

# ---------------------------------------------------------------------------
# Build stage
# ---------------------------------------------------------------------------

build_local:
  extends: .install_pixi
  stage: build
  image: gitlab-registry.cern.ch/linuxsupport/alma9-base
  script:
    # run small pixi tests
    - pixi list
    - pixi run python --version
    - pixi run which gcc
    - pixi run which cc
    - pixi run which c++
    # build project (this also compiles pythia8 and saves it to PYTHIA8_CACHE_DIR)
    - pixi run build
  artifacts:
    expire_in: 1 week
    paths:
      - build/
      # compiled pythia8, restored by downstream local jobs to skip the rebuild
      - .pythia8-cache/
      # prefetched SModelS database pickle, reused by downstream local jobs to skip
      # the re-download
      - .smodels-cache/

# Builds and pushes to a temporary CI tag for testing.
# The final tag is applied by publish_docker after all tests pass.
build_docker:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.14.0-debug
    entrypoint: [""]
  script:
    # Prepare Kaniko configuration file
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    # Build and push to a temporary CI-pipeline-specific tag
    - CI_IMAGE=${CI_REGISTRY_IMAGE}:ci-${CI_PIPELINE_ID}
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${CI_IMAGE}"
    - echo "Image pushed to ${CI_IMAGE}"
    - echo "CI_IMAGE=${CI_IMAGE}" >> deploy.env
  artifacts:
    reports:
      dotenv: deploy.env
    expire_in: 1 day

# ---------------------------------------------------------------------------
# genModels stage — flat prior
# ---------------------------------------------------------------------------

genModels_flat_local:
  extends: .genmodels_local
  stage: genModels
  needs: [build_local, workflow_dryrun_local]
  script:
    - cd run
    - genModels.py --scan_dir scan_flat
    - compare_reference.py --scan flat
  artifacts:
    paths:
      - run/scan_flat
    expire_in: 1 day

genModels_flat_docker:
  extends: .genmodels_docker
  stage: genModels
  needs: [build_docker, workflow_dryrun_local]
  image: ${CI_IMAGE}
  script:
    - cd run
    - pixi run genModels.py --scan_dir scan_flat
    - pixi run compare_reference.py --scan flat
  artifacts:
    paths:
      - run/scan_flat
    expire_in: 1 day

# ---------------------------------------------------------------------------
# genModels stage — fixed prior
# ---------------------------------------------------------------------------

genModels_fixed_local:
  extends: .genmodels_local
  stage: genModels
  needs: [build_local, workflow_dryrun_local]
  script:
    - cd run
    - genModels.py --config_file ../source/Run3ModelGen/data/configs/example_fixed_config.yaml --scan_dir scan_fixed
    - compare_reference.py --scan fixed
  artifacts:
    paths:
      - run/scan_fixed
    expire_in: 1 day

# ---------------------------------------------------------------------------
# genModels stage — mcmc prior
# ---------------------------------------------------------------------------

genModels_mcmc_local:
  extends: .genmodels_local
  stage: genModels
  needs: [build_local, workflow_dryrun_local]
  script:
    - cd run
    # emcee is bit-reproducible at a fixed seed, so this is gated on the chain's VALUES
    # (compare_values in refcheck.SCANS), not only on per-step counts -- every model
    # here clears both steps, so counts alone would assert little.
    - genModels.py --config_file ../source/Run3ModelGen/data/configs/ci_mcmc_config.yaml --scan_dir scan_mcmc
    - test -s scan_mcmc/chain.h5 && test -s scan_mcmc/ntuple.0.0.root
    # the emcee ntuple must carry the reserved likelihood branches + at least one IN_ input
    - python3 -c "import uproot; b=set(uproot.open('scan_mcmc/ntuple.0.0.root')['susy'].keys()); assert {'emcee_logp','chi2'}<=b and any(k.startswith('IN_') for k in b), sorted(b)"
    - compare_reference.py --scan mcmc
  artifacts:
    paths:
      - run/scan_mcmc
    expire_in: 1 day

genModels_mcmc_docker:
  extends: .genmodels_docker
  stage: genModels
  needs: [build_docker, workflow_dryrun_local]
  image: ${CI_IMAGE}
  script:
    - cd run
    # emcee is bit-reproducible at a fixed seed, so this is gated on the chain's VALUES
    # (compare_values in refcheck.SCANS), not only on per-step counts -- every model
    # here clears both steps, so counts alone would assert little.
    - pixi run genModels.py --config_file ../source/Run3ModelGen/data/configs/ci_mcmc_config.yaml --scan_dir scan_mcmc
    - test -s scan_mcmc/chain.h5 && test -s scan_mcmc/ntuple.0.0.root
    # the emcee ntuple must carry the reserved likelihood branches + at least one IN_ input
    - pixi run python3 -c "import uproot; b=set(uproot.open('scan_mcmc/ntuple.0.0.root')['susy'].keys()); assert {'emcee_logp','chi2'}<=b and any(k.startswith('IN_') for k in b), sorted(b)"
    - pixi run compare_reference.py --scan mcmc
  artifacts:
    paths:
      - run/scan_mcmc
    expire_in: 1 day

# ---------------------------------------------------------------------------
# genModels stage — grid prior
# ---------------------------------------------------------------------------

genModels_grid_local:
  extends: .genmodels_local
  stage: genModels
  needs: [build_local, workflow_dryrun_local]
  script:
    - cd run
    - genModels.py --config_file ../source/Run3ModelGen/data/configs/ci_grid_config.yaml --scan_dir scan_grid
    - compare_reference.py --scan grid
  artifacts:
    paths:
      - run/scan_grid
    expire_in: 1 day

# ---------------------------------------------------------------------------
# genModels stage — importance prior
# ---------------------------------------------------------------------------

genModels_importance_local:
  extends: .genmodels_local
  stage: genModels
  needs: [build_local, workflow_dryrun_local]
  script:
    - cd run
    - cp ../source/Run3ModelGen/data/configs/ci_importance_seeds.csv .
    - genModels.py --config_file ../source/Run3ModelGen/data/configs/ci_importance_config.yaml --scan_dir scan_importance
    - compare_reference.py --scan importance
  artifacts:
    paths:
      - run/scan_importance
    expire_in: 1 day

# ---------------------------------------------------------------------------
# genModels stage — snakemake workflow contracts (batch mode + DAG dry-runs)
# ---------------------------------------------------------------------------

# Multi-batch fan-out coverage the single-scan jobs can't provide, exercised
# through the real user surface (genModels.py --backend/--num_jobs/--publish):
# per-batch ntuple naming, b*100000 model-id offsets, tarball member layout
# with the SModelS_xsec -> SPheno/ fold-back, the EOS publish layout, and the
# extract fan-out + extractModels' tarball path.
genModels_batch_local:
  extends: .genmodels_local
  stage: genModels
  needs: [build_local, workflow_dryrun_local]
  script:
    - cd run
    # --keep_local: the assertions below read the local tarball/scan dir, which a
    # plain --publish deliberately deletes (that path is covered separately at the
    # end of this job).
    - EOSPATH=$PWD/fake_eos_pub genModels.py --backend local --num_jobs 2 --runid 90001 --base_seed 123 --scan_dir batchtest --config_file ../source/Run3ModelGen/data/configs/example_fixed_config.yaml --publish --keep_local
    # NB: no `tar ... | grep -q` pipelines — grep -q's early exit SIGPIPEs tar,
    # and the runner's pipefail turns that into exit 141. List/extract to a file first.
    - tar -tzf batchtest/scan.90001.1.tar.gz > tar_members.txt
    - grep -q 'scan.90001.1/ntuple.90001.1.root' tar_members.txt
    - "! grep -q SModelS_xsec tar_members.txt"
    - tar -xzOf batchtest/scan.90001.1.tar.gz scan.90001.1/SPheno/0.slha > spheno0_check.slha
    - grep -q XSECTION spheno0_check.slha
    - python -c "import uproot; ids = uproot.open('batchtest/scan.90001.1/ntuple.90001.1.root:susy')['model'].array(library='np').astype(int).tolist(); assert ids == [100000, 100001, 100002], ids"
    - test -f fake_eos_pub/90001/1/scan.90001.1.tar.gz && test -f fake_eos_pub/90001/1/ntuple.90001.1.root && test -f fake_eos_pub/90001/scan_config.yaml
    - EOSPATH=$PWD/fake_eos_sel extractModels.py --backend local --eos_dir $PWD/fake_eos_pub/90001 --selection "akarr['SS_m_h']!=-1"
    - test -f fake_eos_sel/SelectedModels/90001/Models/SPheno/1/100000.slha
    - EOSPATH=$PWD/fake_eos_single extractModels.py --scan_dir batchtest/scan.90001.1.tar.gz --root_file batchtest/scan.90001.1/ntuple.90001.1.root --selection "akarr['SS_m_h']!=-1"
    - test -f fake_eos_single/SelectedModels/90001/Models/SPheno/1/100000.slha
    # Selective re-run: gm2calc onwards must re-run (manifests deleted + rebuilt)
    # while the upstream steps stay untouched, and the ntuple is regenerated.
    - cp batchtest/r3mg/scan.90001.0/step_SPheno.json spheno_manifest_before.json
    - rerunStep.py --step gm2calc --scan_dir batchtest/scan.90001.0
    # NB: compare with python, not cmp/diff — diffutils is in neither the CI base
    # image nor the pixi environment (cmp exits 127 there).
    - python -c "import pathlib, sys; a = pathlib.Path('spheno_manifest_before.json').read_bytes(); b = pathlib.Path('batchtest/r3mg/scan.90001.0/step_SPheno.json').read_bytes(); sys.exit(0 if a == b else 'SPheno manifest changed - rerunStep re-ran an upstream step it should not have touched')"
    - test -f batchtest/r3mg/scan.90001.0/step_gm2calc.json && test -f batchtest/scan.90001.0/ntuple.90001.0.root
    - python -c "import uproot; ids = uproot.open('batchtest/scan.90001.0/ntuple.90001.0.root:susy')['model'].array(library='np').astype(int).tolist(); assert ids == [0, 1, 2], ids"
    # Default --publish (no --keep_local) is a MOVE: nothing may be left outside
    # EOS afterwards except the r3mg bookkeeping, and re-running must NOT
    # regenerate the batches it just deleted (the scan dirs are gone, so a
    # regression here would re-run the whole scan instead of being a no-op).
    - EOSPATH=$PWD/fake_eos_move genModels.py --backend local --num_jobs 2 --runid 90002 --base_seed 123 --scan_dir movetest --config_file ../source/Run3ModelGen/data/configs/example_fixed_config.yaml --publish
    - test -f fake_eos_move/90002/1/scan.90002.1.tar.gz && test -f fake_eos_move/90002/1/ntuple.90002.1.root && test -f fake_eos_move/90002/scan_config.yaml
    - "! test -e movetest/scan.90002.1"
    - "! test -e movetest/scan.90002.1.tar.gz"
    - test -f movetest/r3mg/scan.90002.1/step_SModelS.json && test -f movetest/r3mg/scan.90002.1/published.ok
    - EOSPATH=$PWD/fake_eos_move genModels.py --backend local --num_jobs 2 --runid 90002 --base_seed 123 --scan_dir movetest --config_file ../source/Run3ModelGen/data/configs/example_fixed_config.yaml --publish 2>&1 | tee resume.log
    - grep -q "Nothing to be done" resume.log
    - "! test -e movetest/scan.90002.1"
    # extraction still works with the local copies gone — that is the point
    - EOSPATH=$PWD/fake_eos_move_sel extractModels.py --backend local --eos_dir $PWD/fake_eos_move/90002 --selection "akarr['SS_m_h']!=-1"
    - test -f fake_eos_move_sel/SelectedModels/90002/Models/SPheno/1/100000.slha

# Cheap contract checks, no physics tools: the unit suite (tests/, including the
# sampled-point golden file that guards the RNG contract the per-step reference
# counts rest on — a changed np.random call order shows up here instead of as a
# mysterious reference mismatch) and a DAG dry-run of every workflow mode. The
# steps live in run_checks.sh, not here, so `pixi run test` runs the same thing.
workflow_dryrun_local:
  # .setup_local, NOT .genmodels_local: nothing here touches EOS, so the fastest
  # and most fundamental job must not depend on the kinit (and its masked
  # credentials) that the reference-comparing scans need.
  extends: .setup_local
  stage: genModels
  needs: [build_local]
  script:
    # Same script as `pixi run test` — one definition, so local and CI cannot drift.
    - bash tests/run_checks.sh

# ---------------------------------------------------------------------------
# extractModels stage — runs on the flat scan output
# ---------------------------------------------------------------------------

extractModels_local:
  extends: .setup_local
  stage: extractModels
  needs: [build_local, genModels_flat_local]
  script:
    - cd run
    - extractModels.py --scan_dir scan_flat --root_file scan_flat/ntuple.0.0.root --selection "(akarr['SS_m_h']!=-1) & (akarr['SS_m_h'] <= 130)"

extractModels_docker:
  extends: .setup_docker
  stage: extractModels
  needs: [build_docker, genModels_flat_docker]
  image: ${CI_IMAGE}
  script:
    - cd run
    - pixi run extractModels.py --scan_dir scan_flat --root_file scan_flat/ntuple.0.0.root --selection "(akarr['SS_m_h']!=-1) & (akarr['SS_m_h'] <= 130)"

# ---------------------------------------------------------------------------
# Publish stage — push the final docker image tag after all tests pass
# ---------------------------------------------------------------------------

publish_docker:
  stage: publish
  needs:
    - job: build_docker
      artifacts: true
    # Docker tests: flat + mcmc only — they validate the image (baked pythia8 /
    # SModelS caches, entrypoint) that gets published here. All five priors are
    # reference-gated in the local track, which resolves from the same pixi.lock, so
    # running every prior twice buys little -- mcmc is the exception worth doubling up
    # on, since only the chain exercises the image's emcee/h5py/arviz stack.
    - job: genModels_flat_docker
      artifacts: false
    - job: genModels_mcmc_docker
      artifacts: false
    - job: extractModels_docker
      artifacts: false
    # Local tests
    - job: genModels_flat_local
      artifacts: false
    - job: genModels_fixed_local
      artifacts: false
    - job: genModels_mcmc_local
      artifacts: false
    - job: genModels_grid_local
      artifacts: false
    - job: genModels_importance_local
      artifacts: false
    - job: extractModels_local
      artifacts: false
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  script:
    - crane auth login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    # Compute the final image tag
    - |
      if test "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH"; then
        FINAL_TAG="latest"
      elif test -n "${CI_COMMIT_TAG}"; then
        FINAL_TAG="${CI_COMMIT_TAG}"
      else
        FINAL_TAG="${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
      fi
    # Copy the tested CI image to the final tag
    - crane cp $CI_IMAGE $CI_REGISTRY_IMAGE:$FINAL_TAG
    - echo "Image published to $CI_REGISTRY_IMAGE:$FINAL_TAG"
