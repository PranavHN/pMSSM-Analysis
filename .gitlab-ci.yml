stages:
  - build
  - genModels
  - extractModels
  - publish

variables:
  GIT_SUBMODULE_STRATEGY: recursive

# ---------------------------------------------------------------------------
# Templates
# ---------------------------------------------------------------------------

.install_pixi:
  before_script:
    # fetch and install pixi locally
    - curl -fsSL https://pixi.sh/install.sh | bash
    - . ~/.bash_profile

# Local template: activates pixi environment + sources build/setup.sh
# so that all subsequent script commands run with the full environment.
.setup_local:
  image: gitlab-registry.cern.ch/linuxsupport/alma9-base
  before_script:
    - curl -fsSL https://pixi.sh/install.sh | bash
    - . ~/.bash_profile
    - eval "$(pixi shell-hook)"
    - source build/setup.sh
    - mkdir -p run

# Docker template: sources ~/.bashrc (which includes pixi + setup.sh)
.setup_docker:
  before_script:
    - . ~/.bashrc
    - mkdir -p run

# ---------------------------------------------------------------------------
# Build stage
# ---------------------------------------------------------------------------

build_local:
  extends: .install_pixi
  stage: build
  image: gitlab-registry.cern.ch/linuxsupport/alma9-base
  script:
    # run small pixi tests
    - pixi list
    - pixi run python --version
    - pixi run which gcc
    - pixi run which cc
    - pixi run which c++
    # build project
    - pixi run build
  artifacts:
    expire_in: 1 week
    paths:
      - build/

# Builds and pushes to a temporary CI tag for testing.
# The final tag is applied by publish_docker after all tests pass.
build_docker:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.14.0-debug
    entrypoint: [""]
  script:
    # Prepare Kaniko configuration file
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    # Build and push to a temporary CI-pipeline-specific tag
    - CI_IMAGE=${CI_REGISTRY_IMAGE}:ci-${CI_PIPELINE_ID}
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${CI_IMAGE}"
    - echo "Image pushed to ${CI_IMAGE}"
    - echo "CI_IMAGE=${CI_IMAGE}" >> deploy.env
  artifacts:
    reports:
      dotenv: deploy.env
    expire_in: 1 day

# ---------------------------------------------------------------------------
# genModels stage — flat prior
# ---------------------------------------------------------------------------

genModels_flat_local:
  extends: .setup_local
  stage: genModels
  needs: [build_local]
  script:
    - cd run
    - genModels.py --scan_dir scan_flat
  artifacts:
    paths:
      - run/scan_flat
    expire_in: 1 day

genModels_flat_docker:
  extends: .setup_docker
  stage: genModels
  needs: [build_docker]
  image: ${CI_IMAGE}
  script:
    - cd run
    - pixi run genModels.py --scan_dir scan_flat
  artifacts:
    paths:
      - run/scan_flat
    expire_in: 1 day

# ---------------------------------------------------------------------------
# genModels stage — fixed prior
# ---------------------------------------------------------------------------

genModels_fixed_local:
  extends: .setup_local
  stage: genModels
  needs: [build_local]
  script:
    - cd run
    - genModels.py --config_file ../source/Run3ModelGen/data/configs/example_fixed_config.yaml --scan_dir scan_fixed
  artifacts:
    paths:
      - run/scan_fixed
    expire_in: 1 day

genModels_fixed_docker:
  extends: .setup_docker
  stage: genModels
  needs: [build_docker]
  image: ${CI_IMAGE}
  script:
    - cd run
    - pixi run genModels.py --config_file ../source/Run3ModelGen/data/configs/example_fixed_config.yaml --scan_dir scan_fixed
  artifacts:
    paths:
      - run/scan_fixed
    expire_in: 1 day

# ---------------------------------------------------------------------------
# genModels stage — mcmc prior
# ---------------------------------------------------------------------------

genModels_mcmc_local:
  extends: .setup_local
  stage: genModels
  needs: [build_local]
  script:
    - cd run
    - genModels.py --config_file ../source/Run3ModelGen/data/configs/ci_mcmc_config.yaml --scan_dir scan_mcmc
  artifacts:
    paths:
      - run/scan_mcmc
    expire_in: 1 day

genModels_mcmc_docker:
  extends: .setup_docker
